# ==============================================================================
# Cloudflare Workers Configuration for Mini Room Nail & Eyelash Telegram Bot
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
# ==============================================================================

name = "mini-room-telegram-bot"
main = "src/index.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Public environment variables (non-sensitive defaults)
[vars]
SALON_NAME = "Mini Room Nail & Eyelash"
SALON_TIMEZONE = "Asia/Phnom_Penh"
ENABLE_AUTO_CLEANUP = "false"
RETENTION_DAYS = "90"

# Optional Cloudflare Cron Trigger (Runs retention cleanup daily at 03:00 AM Asia/Phnom_Penh / 20:00 UTC)
# Uncomment to enable scheduled worker execution:
# [triggers]
# crons = ["0 20 * * *"]

# ==============================================================================
# SECRETS (Do NOT store real secrets in this file!)
# Set them using:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put ADMIN_TELEGRAM_CHAT_ID
# ==============================================================================

# ==============================================================================
# Optional: Cloudflare KV for persistent multi-step bot session & deduplication
# To create the KV namespace:
#   npx wrangler kv:namespace create BOT_SESSIONS
# Then uncomment and fill in your KV ID below:
# ==============================================================================
# [[kv_namespaces]]
# binding = "BOT_SESSIONS"
# id = "YOUR_KV_NAMESPACE_ID_HERE"
